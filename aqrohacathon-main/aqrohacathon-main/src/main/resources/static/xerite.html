<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aqrar investisiya xəritəsi - Əkinçi 2.0</title>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Əkinçi 2.0">
  <meta property="og:title" content="Aqrar investisiya xəritəsi - Əkinçi 2.0">
  <meta property="og:description" content="Azad edilmiş ərazilərdə kənd təsərrüfatı təyinatlı torpaqlar üzrə investisiya müsabiqələri: xəritə, peyk monitorinqi, fəaliyyət planı və elektron müraciət.">
  <meta property="og:image" content="https://aqrohacathon-production.up.railway.app/img/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <script src="/js/lang-boot.js"></script>
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/vendor/leaflet/markercluster/MarkerCluster.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="map-layout">
  <aside class="map-side">
    <div class="side-head">
      <h2 style="font-size:20px;margin-bottom:12px">Aqrar investisiya xəritəsi</h2>
      <div class="search-input" style="margin-bottom:10px"><svg class="i"><use href="/img/icons.svg#i-search"></use></svg><input class="input" id="q" placeholder="Sahə adı, kod və ya kənd..."></div>
      <div class="row-wrap" id="catChips" style="margin-bottom:10px"></div>
      <div class="row" style="gap:8px;margin-bottom:10px">
        <select class="input" id="district"><option value="">Bütün rayonlar</option></select>
        <select class="input" id="area">
          <option value="">İstənilən ölçü</option><option value="0-25">25 ha-ya qədər</option><option value="25-100">25-100 ha</option><option value="100-300">100-300 ha</option><option value="300-">300 ha+</option>
        </select>
      </div>
      <div class="row-wrap" style="gap:14px">
        <label class="check"><input type="checkbox" id="irr">Suvarma</label>
        <label class="check"><input type="checkbox" id="elec">Elektrik</label>
        <label class="check"><input type="checkbox" id="open">Yalnız aktiv müsabiqə</label>
      </div>
      <div class="risk-bar"><button type="button" class="chip chip-tg" id="riskToggle" aria-pressed="false"><svg class="i i-sm"><use href="/img/icons.svg#i-triangle-alert"></use></svg>Risk radarı</button>
        <span class="risk-legend" id="riskLegend" hidden><i class="lv0"></i>aşağı <i class="lv1"></i>orta <i class="lv2"></i>yüksək · rəqəm: xəbərdarlıq sayı</span></div>
    </div>
    <div class="row between" style="padding:10px 18px 0"><b id="count" class="small"></b><a class="small" href="/kataloq.html">Kataloq görünüşü →</a></div>
    <div class="side-list" id="list"><div class="loader"></div></div>
  </aside>
  <section class="map-wrap">
    <div id="map" role="application" aria-label="Sahələrin xəritəsi"></div>
  </section>
</main>
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/vendor/leaflet/markercluster/leaflet.markercluster.js"></script>
<script type="module" src="/js/pages/map.js"></script>
</body>
</html>
