<body>
<main>
  <section class="page-head"><div class="container">
    <div class="crumbs"><a href="/index.html">Ana səhifə</a> / Status yoxlaması</div>
    <h1>Müraciətin statusunu yoxla</h1>
    <p>Sistemə daxil olmadan - müraciət nömrəsi və qəbzdəki 8 simvollu izləmə kodu ilə. Şəxsi məlumatlar göstərilmir.</p>
  </div></section>
  <section class="section-sm"><div class="container" style="max-width:820px">
    <form class="card card-pad" id="form">
      <div class="form-grid" style="grid-template-columns:1fr 1fr auto;align-items:end">
        <div class="field" style="margin:0"><label for="number">Müraciət nömrəsi</label><input class="input mono" id="number" name="number" placeholder="AQR-2026-000016" required></div>
        <div class="field" style="margin:0"><label for="code">İzləmə kodu</label><input class="input mono" id="code" name="code" placeholder="8 simvol" required maxlength="12"></div>
        <button class="btn btn-primary" type="submit" style="height:42px"><svg class="i"><use href="/img/icons.svg#i-search"></use></svg>Yoxla</button>
      </div>
    </form>
    <div id="out" style="margin-top:20px"></div>
  </div></section>
</main>
<script type="module" src="/js/pages/track.js"></script>
</body>
</html>
